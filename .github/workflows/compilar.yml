name: Compilar NAIMSAURIA 26.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Verificar y compilar Fabric 26.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Compilar Java y pruebas
        run: gradle testClasses --stacktrace
      - name: Prueba de director heredado
        run: java -cp build/classes/java/main:build/classes/java/test net.naimsauria.titanes.combat.CombatDirectorTest
      - name: Prueba de máquina de estados
        run: java -cp build/classes/java/main:build/classes/java/test net.naimsauria.titanes.boss.BossCombatMachineTest
      - name: Compilar mod
        run: gradle clean build -x test --stacktrace
      - name: Publicar JAR instalable
        uses: actions/upload-artifact@v4
        with:
          name: NAIMSAURIA-Fase1-26.2
          path: build/libs/naimsauria-titanes-0.2.0-alpha.jar
          if-no-files-found: error
          retention-days: 30
