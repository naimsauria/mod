
name: Compilar NAIMSAURIA 26.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  compilar:
    name: Compilar mod Minecraft 26.2
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar repositorio
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # 2. Instalar Java 25
      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 3. Instalar Gradle 9.5.1
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      # 4. Aplicar correcciones de Minecraft 26.2
      - name: Corregir APIs de Minecraft y GeckoLib
        run: |
          python3 fix_naimsauria_26_2.py

      # 5. Compilar las clases Java y de pruebas
      - name: Compilar código Java
        run: |
          gradle testClasses --stacktrace

      # 6. Ejecutar pruebas de combate
      - name: Comprobar fases y ataques
        run: |
          java -cp build/classes/java/main:build/classes/java/test \
            net.naimsauria.titanes.combat.CombatDirectorTest

      # 7. Generar el archivo JAR
      - name: Generar mod NAIMSAURIA
        run: |
          gradle clean build -x test --stacktrace

      # 8. Comprobar archivos generados
      - name: Verificar JAR
        run: |
          echo "Archivos JAR generados:"
          ls -lh build/libs/
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' -print -quit)"

      # 9. Subir el mod compilado
      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: NAIMSAURIA-Minecraft-26.2
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
